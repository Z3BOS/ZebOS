<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZebOS v1.0.0 (Alpha Build)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-window">
        <header>
            <h1>ZebOS Alpha Version 1.0.0</h1>
        </header>

        <div id="shell-log"></div>

        <div class="input-row">
            <span id="prompt">user@zebos:~$</span>
            <input type="text" id="shell-input" placeholder="type command, type /help for help..." autofocus>
            <button id="send-btn">Submit</button>
        </div>
    </div>
    <script src="os.js"></script>
</body>
</html>
